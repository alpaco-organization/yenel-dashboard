server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # ALB/ECS saglik kontrolu (target group health check path: /health).
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Next static export, trailingSlash: true -> /dashboard/index.html
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Hash'li asset'ler; uzun cache guvenli.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
}
